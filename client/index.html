<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pixel-Abenteuer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" />
    <style>
      html, body { margin: 0; height: 100%; background: #1b1424; color: #f4ecd8; font-family: system-ui, sans-serif; }
      #spiel { position: fixed; inset: 0; }
      #spiel canvas { image-rendering: pixelated; }
      #start { position: fixed; inset: 0; display: grid; place-items: center; background: #1b1424; z-index: 2; }
      #start form { display: grid; gap: 12px; padding: 24px; max-width: 320px; width: calc(100% - 32px); box-sizing: border-box; }
      #start h1 { margin: 0; font-size: 28px; letter-spacing: 1px; }
      #start p { margin: 0; color: #b9aec8; font-size: 14px; line-height: 1.5; }
      #start input, #start button { font: inherit; font-size: 18px; padding: 10px 12px; border-radius: 6px; border: 2px solid #4a3a5c; }
      #start input { background: #2a2036; color: inherit; }
      #start button { background: #3fae4a; color: #10240f; border-color: #2b7d35; font-weight: 700; cursor: pointer; }
      #start .fehler { color: #ff8a8a; min-height: 1.5em; }
    </style>
  </head>
  <body>
    <div id="start">
      <form id="anmelden">
        <h1>Pixel-Abenteuer</h1>
        <p id="hinweis">Bis zu vier Leute spielen zusammen. Laufen mit Pfeiltasten oder WASD, Schwert mit Leertaste oder J, ansprechen und öffnen mit E.</p>
        <input id="name" maxlength="14" placeholder="Dein Name" autocomplete="nickname" required />
        <button type="submit">Losspielen</button>
        <p class="fehler" id="fehler"></p>
      </form>
    </div>
    <div id="spiel"></div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
