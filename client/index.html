<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pixel-Abenteuer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" />
    <style>
      html, body { margin: 0; height: 100%; background: #1b1424; color: #f4ecd8; font-family: system-ui, sans-serif; }
      #spiel { position: fixed; inset: 0; }
      #spiel canvas { image-rendering: pixelated; }
      /* flex + margin:auto statt place-items:center — sonst wäre der obere
         Teil der Charakterwahl am Handy nicht erreichbar, wenn sie höher ist
         als der Schirm. */
      #start { position: fixed; inset: 0; display: flex; background: #1b1424; z-index: 2; overflow-y: auto; }
      #start form { display: grid; gap: 12px; padding: 24px 16px; margin: auto; max-width: 320px; width: 100%; box-sizing: border-box; }
      #start form[hidden] { display: none; }
      #start #wahl { max-width: 720px; }
      #wahl h2 { margin: 8px 0 0; font-size: 16px; color: #e8c15a; }
      .karten { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
      .karten input { position: absolute; opacity: 0; pointer-events: none; }
      .karte { display: grid; gap: 4px; align-content: start; padding: 10px; border: 2px solid #4a3a5c; border-radius: 6px; background: #2a2036; cursor: pointer; font-size: 13px; line-height: 1.4; color: #b9aec8; overflow-wrap: anywhere; }
      .karte b { color: #f4ecd8; font-size: 15px; }
      .karten input:checked + .karte { border-color: #e8c15a; background: #3a2c48; }
      .karten input:focus-visible + .karte { outline: 2px solid #f4ecd8; outline-offset: 2px; }
      .bild { width: 64px; height: 64px; background-size: 256px 256px; background-position: 0 0; image-rendering: pixelated; }
      #vorschau { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: start; padding: 12px; border-radius: 6px; background: #2a2036; font-size: 14px; line-height: 1.5; }
      #vorschau .bild { width: 96px; height: 96px; background-size: 384px 384px; }
      .attribute { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 2px 10px; font-variant-numeric: tabular-nums; }
      #start h1 { margin: 0; font-size: 28px; letter-spacing: 1px; }
      #start p { margin: 0; color: #b9aec8; font-size: 14px; line-height: 1.5; }
      #start input, #start button { font: inherit; font-size: 18px; padding: 10px 12px; border-radius: 6px; border: 2px solid #4a3a5c; }
      #start input { background: #2a2036; color: inherit; }
      #start button { background: #3fae4a; color: #10240f; border-color: #2b7d35; font-weight: 700; cursor: pointer; }
      #start .fehler { color: #ff8a8a; min-height: 1.5em; }
      /* Rucksack und Laden (client/fenster.js) */
      #fenster { position: fixed; inset: 0; z-index: 3; display: flex; background: rgba(27, 20, 36, 0.6); overflow-y: auto; padding: 16px; box-sizing: border-box; }
      #fenster[hidden] { display: none; }
      #fenster .kasten { margin: auto; width: 100%; max-width: 560px; box-sizing: border-box; padding: 16px; border: 3px solid #4a3a5c; border-radius: 8px; background: #241b30; font-size: 14px; line-height: 1.45; }
      #fenster .kopf { display: flex; align-items: center; gap: 12px; }
      #fenster h2 { margin: 0; flex: 1; font: 14px "Press Start 2P", monospace; color: #e8c15a; overflow-wrap: anywhere; }
      #fenster h3 { margin: 16px 0 6px; font-size: 14px; color: #e8c15a; }
      #fenster h3 small { color: #b9aec8; font-weight: 400; }
      #fenster p { margin: 4px 0; color: #b9aec8; }
      #fenster .gold { display: flex; align-items: center; gap: 4px; font-weight: 700; }
      #fenster button { font: inherit; color: #f4ecd8; background: #3a2c48; border: 2px solid #5a4870; border-radius: 6px; padding: 6px 10px; cursor: pointer; }
      #fenster button:focus-visible { outline: 3px solid #f4d24a; outline-offset: 2px; }
      #fenster button:disabled { opacity: 0.55; cursor: not-allowed; }
      #fenster .zu { padding: 4px 10px; }
      #fenster .werte, #fenster .gruppe { display: flex; flex-wrap: wrap; gap: 4px 14px; color: #f4ecd8; }
      #fenster .gruppe span { display: flex; align-items: center; gap: 6px; }
      .symbol { display: inline-block; flex: none; width: 32px; height: 32px; background-image: url(grafik/gegenstaende.png); image-rendering: pixelated; }
      .symbol.gross { width: 48px; height: 48px; }
      /* Ein leerer Platz zeigte sonst das ganze Bildblatt gekachelt (Gold und Schlüssel). */
      .symbol { background-repeat: no-repeat; }
      .symbol.leer { background-image: none; }
      #fenster .plaetze { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
      #fenster .platz { display: flex; align-items: center; gap: 8px; text-align: left; padding: 6px; border: 2px solid #5a4870; border-radius: 6px; min-width: 0; overflow-wrap: anywhere; }
      #fenster .platz small { display: block; color: #b9aec8; font-size: 12px; }
      #fenster .platz.leer { border-style: dashed; color: #8a7e9a; }
      #fenster .raster { display: grid; grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); gap: 6px; }
      #fenster .feld { position: relative; display: grid; place-items: center; height: 52px; padding: 0; border: 2px solid #3a2e48; border-radius: 6px; background: #1b1424; }
      #fenster button.feld { border-color: #5a4870; background: #3a2c48; }
      #fenster .feld b { position: absolute; right: 4px; bottom: 2px; font-size: 12px; }
      #fenster .an { border-color: #e8c15a !important; }
      #fenster .einzeln { display: flex; gap: 12px; margin-top: 14px; padding: 12px; border-radius: 6px; background: #2e2340; overflow-wrap: anywhere; }
      #fenster .einzeln > div { min-width: 0; }
      #fenster .boni { color: #8fe08a; }
      #fenster .knoepfe { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
      #fenster .knopf { display: grid; gap: 2px; justify-items: start; }
      #fenster .grund { color: #ffb08a; font-size: 12px; }
      #fenster .tipp { margin-top: 12px; font-style: italic; }
      #fenster .gruss { font-style: italic; }
      #fenster .liste { display: grid; gap: 6px; }
      #fenster .ware { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 6px; border-radius: 6px; background: #2e2340; }
      #fenster .ware > span:nth-child(2) { display: grid; min-width: 0; overflow-wrap: anywhere; }
      #fenster .ware small { color: #b9aec8; font-size: 12px; }
      #fenster .ware .knopf { justify-items: end; text-align: right; }
      @media (max-width: 420px) { #fenster .ware { grid-template-columns: auto 1fr; } #fenster .ware .knopf { grid-column: 1 / -1; justify-items: start; text-align: left; } }
      /* Rucksack-Knopf am Rand: für Maus und Finger (Taste I geht auch) */
      #rucksack-knopf { position: fixed; right: 12px; bottom: 12px; z-index: 2; width: 48px; height: 48px; padding: 6px; border: 2px solid #5a4870; border-radius: 8px; background: rgba(36, 27, 48, 0.85); cursor: pointer; }
      #rucksack-knopf[hidden] { display: none; }
    </style>
  </head>
  <body>
    <div id="start">
      <form id="anmelden">
        <h1>Pixel-Abenteuer</h1>
        <p id="hinweis">Bis zu vier Leute spielen zusammen. Laufen mit Pfeiltasten oder WASD, Schwert mit Leertaste oder J, ansprechen und öffnen mit E, Klassen-Fähigkeit mit Q, Rucksack mit I, Trank mit 1.</p>
        <input id="name" maxlength="14" placeholder="Dein Name" autocomplete="nickname" required />
        <button type="submit">Losspielen</button>
        <p class="fehler" id="fehler"></p>
      </form>
      <!-- Erscheint nur beim ersten Mal; gebaut von charakterwahl.js -->
      <form id="wahl" hidden></form>
    </div>
    <div id="spiel"></div>
    <div id="fenster" hidden></div>
    <button id="rucksack-knopf" hidden aria-label="Rucksack (I)" title="Rucksack (I)"><span class="symbol" style="background-position:-160px 0;background-size:288px 32px"></span></button>
    <script type="module" src="./main.js"></script>
  </body>
</html>
